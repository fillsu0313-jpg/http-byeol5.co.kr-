<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}쿠팡 순이익 대시보드{% endblock %}</title>
    <link rel="stylesheet" href="/static/design-system.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: { sans: ['Pretendard','Pretendard Variable','-apple-system','BlinkMacSystemFont','Apple SD Gothic Neo','Segoe UI','Malgun Gothic','sans-serif'] },
                colors: {
                    page:    'var(--bg)',
                    surface: { DEFAULT:'var(--surface)', 2:'var(--surface-2)', up:'var(--surface-elevated)' },
                    line:    { DEFAULT:'var(--border)', strong:'var(--border-strong)' },
                    ink:     { DEFAULT:'var(--text-primary)', 2:'var(--text-secondary)', 3:'var(--text-muted)' },
                    accent:  { DEFAULT:'var(--brand-primary)', hover:'var(--brand-primary-hover)', ink:'var(--brand-primary-ink)', soft:'var(--accent-soft)' },
                    ok:      { DEFAULT:'var(--st-ok)', soft:'var(--st-ok-soft)' },
                    caution: { DEFAULT:'var(--st-caution)', soft:'var(--st-caution-soft)' },
                    danger:  { DEFAULT:'var(--st-danger)', soft:'var(--st-danger-soft)' },
                    info:    { DEFAULT:'var(--st-info)', soft:'var(--st-info-soft)' },
                },
                borderColor: { DEFAULT:'var(--border)' },
                borderRadius: { DEFAULT: '8px' },
            }
        }
    }
    </script>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="ds-nav">
        <div class="ds-nav-inner">
            <a href="/" class="ds-nav-brand">
                <span class="mark">B</span>
                별오점 순이익
            </a>
            <div class="ds-nav-links">
                <a href="/" class="{% block nav_dashboard %}{% endblock %}">대시보드</a>
                <a href="/costs" class="{% block nav_costs %}{% endblock %}">원가 관리</a>
                <a href="/upload" class="{% block nav_upload %}{% endblock %}">데이터 업로드</a>
            </div>
        </div>
    </nav>

    <main class="ds-main">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
